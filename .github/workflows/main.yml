name: Generate Snake

on:
  schedule:
    # Se ejecuta automáticamente cada 24 horas a la medianoche
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite la ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: LizardoFSA # Tu nombre de usuario
          outputs: |
            # Versión para tema claro (opcional, si quieres usar la paleta por defecto)
            dist/github-contribution-grid-snake.svg
            # Versión para tema oscuro con paleta púrpura personalizada (como la imagen)
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bf40bf&color_dots=#f2e6ff,#e6ccff,#cc99ff,#b366ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}